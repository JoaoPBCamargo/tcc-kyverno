# Brecha 1: o Pod declara nao-root, mas o conteiner sobrescreve e roda como root.
# A configuracao do conteiner prevalece sobre a do Pod.
apiVersion: v1
kind: Pod
metadata:
  name: b1-root-no-conteiner
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: nginx
    image: nginx:1.25.0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
