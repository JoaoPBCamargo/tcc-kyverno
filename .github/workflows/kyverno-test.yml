name: kyverno-test

on:
  push:
  pull_request:

jobs:
  kyverno-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.11.5 e 1.19.2: versões do CLI citadas na Seção 4.3 da monografia;
        # 1.18.1: versão do Kyverno instalado no cluster (chart 3.8.1)
        kyverno: ["v1.11.5", "v1.18.1", "v1.19.2"]
    steps:
      - uses: actions/checkout@v7

      - name: Instalar o Kyverno CLI ${{ matrix.kyverno }}
        env:
          VERSION: ${{ matrix.kyverno }}
        run: |
          ASSET="kyverno-cli_${VERSION}_linux_x86_64.tar.gz"
          BASE="https://github.com/kyverno/kyverno/releases/download/${VERSION}"
          curl -sSLO "${BASE}/${ASSET}"
          curl -sSL -o checksums.txt "${BASE}/checksums.txt"
          grep " ${ASSET}$" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}" kyverno
          sudo install kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Rodar os testes das políticas
        run: kyverno test .
