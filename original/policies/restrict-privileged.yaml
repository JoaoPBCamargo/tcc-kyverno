apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-privileged
spec:
  validationFailureAction: Enforce
  rules:
    - name: check-privileged
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Erro: Containers privilegiados não são permitidos!"
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
