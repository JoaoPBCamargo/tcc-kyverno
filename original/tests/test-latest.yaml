apiVersion: v1
kind: Pod
metadata:
  name: test-latest
spec:
  containers:
  - name: nginx
    image: nginx:latest  # VIOLA POLÍTICA 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 101
