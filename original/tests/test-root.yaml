apiVersion: v1
kind: Pod
metadata:
  name: test-root
spec:
  containers:
  - name: nginx
    image: nginx:1.25.0
    securityContext:
      runAsUser: 0  # VIOLA POLÍTICA 2 (root = UID 0)
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
