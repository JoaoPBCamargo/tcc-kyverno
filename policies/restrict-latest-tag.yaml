apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Toda imagem deve ter uma tag explícita (ex.: nginx:1.25.0)."
        pattern:
          spec:
            =(initContainers):
              - image: "*:*"
            containers:
              - image: "*:*"
    - name: check-tag
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "A tag 'latest' não é permitida. Use uma versão específica (ex.: nginx:1.25.0) ou um digest."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
