# Resultados esperados das politicas corrigidas.
# Cada teste T1-T4 parte do Pod seguro (T0) e muda uma unica coisa, entao deve
# falhar em exatamente uma politica. B1-B3 sao as brechas das politicas originais.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: politicas-corrigidas
policies:
  - policies/restrict-privileged.yaml
  - policies/require-nonroot.yaml
  - policies/require-limits.yaml
  - policies/restrict-latest-tag.yaml
resources:
  - tests/t0-seguro.yaml
  - tests/t1-privilegiado.yaml
  - tests/t2-root.yaml
  - tests/t3-latest.yaml
  - tests/t4-sem-limites.yaml
  - tests/b1-root-no-conteiner.yaml
  - tests/b2-imagem-sem-tag.yaml
  - tests/b3-initcontainer-privilegiado.yaml
  - tests/d1-deployment-privilegiado.yaml
results:
  # restrict-privileged
  - policy: restrict-privileged
    rule: check-privileged
    kind: Pod
    resources: [t1-privilegiado, b3-initcontainer-privilegiado]
    result: fail
  - policy: restrict-privileged
    rule: check-privileged
    kind: Pod
    resources: [t0-seguro, t2-root, t3-latest, t4-sem-limites, b1-root-no-conteiner, b2-imagem-sem-tag]
    result: pass
  - policy: restrict-privileged
    rule: autogen-check-privileged
    kind: Deployment
    resources: [d1-deployment-privilegiado]
    result: fail
  # require-nonroot
  - policy: require-nonroot
    rule: check-runasnonroot
    kind: Pod
    resources: [t2-root, b1-root-no-conteiner]
    result: fail
  - policy: require-nonroot
    rule: check-runasnonroot
    kind: Pod
    resources: [t0-seguro, t1-privilegiado, t3-latest, t4-sem-limites, b2-imagem-sem-tag, b3-initcontainer-privilegiado]
    result: pass
  - policy: require-nonroot
    rule: check-runasuser
    kind: Pod
    resources: [t2-root, b1-root-no-conteiner]
    result: fail
  - policy: require-nonroot
    rule: check-runasuser
    kind: Pod
    resources: [t0-seguro, t1-privilegiado, t3-latest, t4-sem-limites, b2-imagem-sem-tag, b3-initcontainer-privilegiado]
    result: pass
  # require-limits
  - policy: require-limits
    rule: check-limits
    kind: Pod
    resources: [t4-sem-limites, b3-initcontainer-privilegiado]
    result: fail
  - policy: require-limits
    rule: check-limits
    kind: Pod
    resources: [t0-seguro, t1-privilegiado, t2-root, t3-latest, b1-root-no-conteiner, b2-imagem-sem-tag]
    result: pass
  # restrict-latest-tag
  - policy: restrict-latest-tag
    rule: require-image-tag
    kind: Pod
    resources: [b2-imagem-sem-tag]
    result: fail
  - policy: restrict-latest-tag
    rule: require-image-tag
    kind: Pod
    resources: [t0-seguro, t1-privilegiado, t2-root, t3-latest, t4-sem-limites, b1-root-no-conteiner, b3-initcontainer-privilegiado]
    result: pass
  - policy: restrict-latest-tag
    rule: check-tag
    kind: Pod
    resources: [t3-latest, b3-initcontainer-privilegiado]
    result: fail
  - policy: restrict-latest-tag
    rule: check-tag
    kind: Pod
    resources: [t0-seguro, t1-privilegiado, t2-root, t4-sem-limites, b1-root-no-conteiner, b2-imagem-sem-tag]
    result: pass
